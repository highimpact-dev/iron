name: Iron
options:
  bundleIdPrefix: dev.highimpact
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Iron:
    type: application
    platform: iOS
    sources:
      - path: Iron
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.highimpact.iron
        PRODUCT_NAME: Iron
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: "\"Iron/Preview Content\""
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Iron reads your workouts, heart rate, and body metrics from Health to track lifting and conditioning progress."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Iron writes completed workouts back to Health so your training is in one place."
        INFOPLIST_KEY_NSMotionUsageDescription: "Iron uses motion data to detect rest periods and rep tempo."
    entitlements:
      path: Iron/Iron.entitlements
      properties:
        com.apple.developer.healthkit: true

schemes:
  Iron:
    build:
      targets:
        Iron: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
